name: Publish to npm

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  npm-publish:
    uses: jabranr/workflows/.github/workflows/reusable-npm-publish.yml@72be0cd7d8e82e7130c9d4890daf369cffeecdaf # main @ 2026-11-24
    with:
      use-lerna: false
      run-build: false
      run-unit-test: false
      run-lint: false
      run-format-check: false
      run-typecheck: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
