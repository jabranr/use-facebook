name: Publish to npm

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  npm-publish:
    uses: jabranr/workflows/.github/workflows/reusable-npm-publish.yml@59972e7319b1eb97d518e166633be1acddaf05db # main @ 2026-11-24
    with:
      use-lerna: false
      run-lint: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
