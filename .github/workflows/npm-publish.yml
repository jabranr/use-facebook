name: Node.js Package

on:
  push:
    tags: ['*']

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: "npm"
          registry-url: https://registry.npmjs.org/
      - run: npm publish
